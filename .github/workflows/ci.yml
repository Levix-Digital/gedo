name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The identity snapshot of the repository's own history needs every commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the SSH server for the SSH remote test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: SSH remote
        if: runner.os == 'Linux'
        env:
          GEDO_TEST_SSH: "1"
        run: cargo test -p gedo-store --test transport -- --include-ignored ssh_remote
      - name: Architecture check
        run: cargo xtask arch-check
      - name: Parser sweep over the locked dependencies
        if: runner.os == 'Linux'
        run: |
          cargo fetch
          cargo xtask parse-sweep

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bench:
    name: bench (${{ matrix.os }}, not blocking)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clone the reference history (ripgrep 14.1.1)
        shell: bash
        run: |
          git clone --quiet --branch 14.1.1 https://github.com/BurntSushi/ripgrep "$RUNNER_TEMP/ripgrep"
          test "$(git -C "$RUNNER_TEMP/ripgrep" rev-parse HEAD)" = 4649aa9700619f94cf9c66876e9549d83420e16c
      - name: Benchmarks
        shell: bash
        env:
          GEDO_BENCH_REPO: ${{ runner.temp }}/ripgrep
        run: |
          cargo bench -p gedo-store --bench wal_append -- --quick | tee bench-output.txt
          cargo bench -p gedo-parse --bench parse_rust -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-ast --bench match_change -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-app --bench index_history -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-app --bench events -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-app --bench reattach -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-crdt --bench tree -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-app --bench converge -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-app --bench split -- --quick | tee -a bench-output.txt
          cargo bench -p gedo-app --bench detached -- --quick | tee -a bench-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: |
            bench-output.txt
            target/criterion
