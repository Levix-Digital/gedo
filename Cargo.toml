[workspace]
resolver = "3"
members = [
    "crates/core/gedo-core",
    "crates/core/gedo-ast",
    "crates/core/gedo-crdt",
    "crates/core/gedo-app",
    "crates/adapters/gedo-store",
    "crates/adapters/gedo-parse",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Levix-Digital/gedo"
publish = false

[workspace.dependencies]
gedo-core = { path = "crates/core/gedo-core" }
gedo-ast = { path = "crates/core/gedo-ast" }
gedo-crdt = { path = "crates/core/gedo-crdt" }
gedo-app = { path = "crates/core/gedo-app" }
gedo-parse = { path = "crates/adapters/gedo-parse" }
gedo-store = { path = "crates/adapters/gedo-store" }
gix = { version = "0.90", default-features = false }
# Only to enable pack writing in the `gix-pack` that `gix` already uses; versions move together.
gix-pack = { version = "0.77", default-features = false }
redb = "4.4"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
crc32fast = "1.5"
thiserror = "2.0"
tracing = "0.1"
proptest = "1.12"
tempfile = "3.27"
criterion = "0.8"
cargo_metadata = "0.23"
serde_json = "1.0"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
blake3 = "1.8"
insta = { version = "1.49", features = ["yaml"] }
similar = "2.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
