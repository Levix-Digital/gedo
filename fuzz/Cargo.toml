# Coverage-guided fuzzing of the parser and of the identity records (SC-007). Outside the workspace because cargo-fuzz needs
# a nightly toolchain: `cargo +nightly fuzz run parse_rust -- -max_total_time=600`.
[package]
name = "gedo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gedo-core = { path = "../crates/core/gedo-core" }
gedo-ast = { path = "../crates/core/gedo-ast" }
gedo-parse = { path = "../crates/adapters/gedo-parse" }
gedo-app = { path = "../crates/core/gedo-app" }

[[bin]]
name = "parse_rust"
path = "fuzz_targets/parse_rust.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_identity_record"
path = "fuzz_targets/decode_identity_record.rs"
test = false
doc = false
bench = false

# Not a member of the repository's workspace.
[workspace]
